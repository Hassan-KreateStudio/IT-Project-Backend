<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph — IT Project</title>
<style>
  @font-face { font-family:'Bricolage'; src:url('fonts/BricolageGrotesque-ExtraBold.otf'); font-weight:800; }
  @font-face { font-family:'Outfit'; src:url('fonts/Outfit-Regular.otf'); font-weight:400; }
  @font-face { font-family:'Outfit'; src:url('fonts/Outfit-Medium.otf'); font-weight:500; }
  @font-face { font-family:'Outfit'; src:url('fonts/Outfit-Bold.otf'); font-weight:700; }

  :root{
    --ink:#0A0A0A; --night:#161616; --dusk:#2A2A2A;
    --flare:#FF3DAB; --acid:#D8FF3C; --aurora:#3DFFE7;
    --canvas:#F6F4F0; --card:#FFFFFF; --hairline:#E6E2DC;
    --mist:#EFECE6; --alert:#FF4D3A; --warn:#FFB020; --mute:#6E6E6E;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:var(--ink); color:#fff;
    font-family:'Outfit',system-ui,sans-serif;
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:28px 32px 20px; border-bottom:1px solid #1e1e1e;
  }
  h1{
    font-family:'Bricolage'; font-weight:800; font-size:40px;
    letter-spacing:-1.2px; line-height:1;
  }
  .sub{ color:var(--mute); font-size:13px; margin-top:6px; }
  .badge{
    display:inline-flex; align-items:center; gap:7px;
    font-size:10px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--acid); border:1px solid rgba(216,255,60,0.28);
    padding:6px 11px; border-radius:999px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--acid); }

  main{ flex:1; display:flex; min-height:0; }

  aside{
    width:260px; flex:0 0 260px; border-right:1px solid #1e1e1e;
    padding:20px 16px; overflow-y:auto;
  }
  .label{
    font-size:10px; letter-spacing:1.8px; font-weight:700; text-transform:uppercase;
    color:var(--mute); margin:0 6px 10px;
  }
  .item{
    display:flex; align-items:center; gap:9px;
    padding:9px 10px; border-radius:10px;
    font-size:13px; color:#bdbdbd; cursor:pointer;
  }
  .item:hover{ background:#181818; color:#fff; }
  .item.soon{ cursor:default; opacity:.45; }
  .swatch{ width:8px; height:8px; border-radius:2px; flex:0 0 8px; }

  .stage{
    flex:1; position:relative; display:grid; place-items:center;
    background:
      radial-gradient(circle at 50% 42%, rgba(255,61,171,0.06), transparent 55%),
      var(--ink);
  }
  .empty{ text-align:center; max-width:440px; padding:24px; }
  .empty h2{
    font-family:'Bricolage'; font-weight:800; font-size:26px;
    letter-spacing:-0.6px; margin-bottom:10px;
  }
  .empty p{ color:var(--mute); font-size:14px; line-height:1.5; }
  .empty code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    background:#181818; border:1px solid #242424; border-radius:6px;
    padding:2px 6px; font-size:12px; color:var(--acid);
  }

  .left{ position:relative; flex:1; min-width:0; }
  #cy{ position:absolute; inset:0; }
  .detail{
    position:absolute; right:20px; top:20px; width:260px;
    background:rgba(22,22,22,0.96); border:1px solid #2a2a2a;
    border-radius:16px; padding:14px 15px; display:none;
    backdrop-filter:blur(12px);
  }
  .detail h3{
    font-family:'Bricolage'; font-weight:800; font-size:16px;
    letter-spacing:-0.3px; margin-bottom:8px;
  }
  .detail .row{
    display:flex; justify-content:space-between; gap:10px;
    font-size:12px; padding:3px 0; border-bottom:1px solid #1f1f1f;
  }
  .detail .row:last-child{ border-bottom:none; }
  .detail .key{ color:var(--mute); }
  .detail .val{ color:#fff; text-align:right; word-break:break-word; }
  #legend{ display:flex; align-items:center; gap:14px; }
  .legend{ display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--mute); }
  .legend .swatch{ width:7px; height:7px; border-radius:2px; }

  footer{
    border-top:1px solid #1e1e1e; padding:12px 32px;
    display:flex; gap:18px; align-items:center;
    font-size:11px; color:var(--mute);
  }
  footer .accent{ color:var(--flare); }
  footer .spacer{ flex:1; }

  .left{ position:relative; flex:1; min-width:0; }
  #cy{ position:absolute; inset:0; }
  .chip{
    background:none; border:1px solid #2a2a2a; border-radius:999px;
    padding:7px 11px; font-family:'Outfit',sans-serif; font-size:11px;
    font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
    color:#9a9a9a; cursor:pointer;
  }
  .chip.on{ background:#FF3DAB; border-color:#FF3DAB; color:#0A0A0A; }
  .chip.amber.on{ background:#FFB020; border-color:#FFB020; }
  .crumb{ margin-left:auto; font-size:12px; color:#9a9a9a; }
  .crumb b{ color:#fff; }
  .crumb span{ cursor:pointer; }
  .crumb span:hover{ color:#FF3DAB; }
  .panel{
    position:relative; inset:auto; width:340px; flex:0 0 340px;
    padding:22px 24px; overflow-y:auto; border-left:1px solid #1c1c1c;
    background:none; border-radius:0; backdrop-filter:none;
  }
  .note{
    position:absolute; left:32px; top:16px; font-size:12px; color:#8a8a8a;
    background:#141414; border:1px solid #242424; border-radius:9px;
    padding:8px 12px; opacity:0; transition:opacity .2s;
  }
  .label{ font-size:10px; letter-spacing:1.8px; font-weight:700; text-transform:uppercase; color:#6E6E6E; margin-bottom:10px; }
  .daynum{ font-family:'Bricolage'; font-size:40px; letter-spacing:-1.4px; line-height:1; }
  .value{ font-family:'Bricolage'; font-size:52px; letter-spacing:-2px; line-height:1; }
  .meta{ font-size:12px; color:#6E6E6E; margin-top:4px; }
  .reading{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #1c1c1c; cursor:pointer; }
  .reading:hover{ background:#131313; }
  .reading .t{ font-size:11px; color:#6E6E6E; width:44px; }
  .reading .v{ font-family:'Bricolage'; font-size:19px; letter-spacing:-0.6px; }
  .reading .s{ font-size:11px; color:#6E6E6E; margin-left:auto; }
  .stat{ display:flex; justify-content:space-between; font-size:12px; padding:5px 0; }
  .stat span:first-child{ color:#6E6E6E; }

  .key{
    position:absolute; left:24px; bottom:20px; width:200px;
    background:rgba(20,20,20,0.94); border:1px solid #262626; border-radius:14px;
    padding:13px 14px; backdrop-filter:blur(10px);
  }
  .keyTitle{ font-family:'Bricolage'; font-weight:800; font-size:12px; color:#fff; margin-bottom:8px; }
  .keyGroup{ font-size:9px; letter-spacing:1.5px; font-weight:700; text-transform:uppercase; color:#6E6E6E; margin:10px 0 6px; }
  .keyRow{ display:flex; align-items:center; gap:8px; font-size:11px; color:#bdbdbd; padding:2px 0; }
  .keyRow .dot{ width:9px; height:9px; border-radius:50%; flex:0 0 9px; }
  .keyRow .diamond{ width:9px; height:9px; transform:rotate(45deg); flex:0 0 9px; }
  .keyHint{ font-size:10px; color:#6E6E6E; margin-top:10px; line-height:1.4; }
</style>
</head>
<body>
  <header>
    <h1>Graph Analysis</h1>
    <button class="chip on" id="f-all">90 days</button>
    <button class="chip" id="f-glucose">Glucose only</button>
    <button class="chip" id="f-high">High days</button>
    <div class="crumb" id="crumb"></div>
  </header>

  <main>
    <div class="left">
      <div id="cy"></div>
      <div class="note" id="note"></div>
      <div class="key" id="key">
        <div class="keyTitle">Key</div>
        <div class="keyGroup">Nodes</div>
        <div class="keyRow"><span class="dot" style="background:#D8FF3C"></span><span id="keyUser">You</span></div>
        <div class="keyRow"><span class="dot" style="background:#FFFFFF"></span>Day</div>
        <div class="keyRow"><span class="dot" style="background:#FF3DAB"></span>Steps</div>
        <div class="keyRow"><span class="dot" style="background:#3DFFE7"></span>Heart rate</div>
        <div class="keyRow"><span class="dot" style="background:#9B7BFF"></span>Active minutes</div>
        <div class="keyRow"><span class="dot" style="background:#8A8A8A"></span>Sedentary</div>
        <div class="keyGroup">Readings (diamond)</div>
        <div class="keyRow"><span class="diamond" style="background:#4D7CFF"></span>In range 70–180</div>
        <div class="keyRow"><span class="diamond" style="background:#FFB020"></span>High, over 180</div>
        <div class="keyRow"><span class="diamond" style="background:#FF4D3A"></span>Low, under 70</div>
        <div class="keyHint">Click a day to open it, then a reading.</div>
      </div>
    </div>
    <aside class="panel" id="panel"></aside>
  </main>

  <footer>
    <span class="accent">●</span>
    <span id="status">loading…</span>
    <span class="spacer"></span>

    <span>IT Project</span>
  </footer>

  <script src="cytoscape.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
